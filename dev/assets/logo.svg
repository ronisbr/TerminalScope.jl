<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Terminal window. -->
  <rect x="16" y="40" width="288" height="240" rx="20" fill="#0A1929" stroke="#1E3A5F" stroke-width="6"/>

  <!-- Title bar dots in the Julia logo colors. -->
  <circle cx="52" cy="72" r="9" fill="#CB3C33"/>
  <circle cx="80" cy="72" r="9" fill="#389826"/>
  <circle cx="108" cy="72" r="9" fill="#9558B2"/>
  <line x1="16" y1="94" x2="304" y2="94" stroke="#1E3A5F" stroke-width="4"/>

  <!-- Profile drill-down bars. -->
  <rect x="48" y="118" width="208" height="26" rx="7" fill="#389826"/>
  <rect x="72" y="158" width="152" height="26" rx="7" fill="#9558B2"/>
  <rect x="96" y="198" width="100" height="26" rx="7" fill="#CB3C33"/>

  <!-- Scope lens. -->
  <circle cx="216" cy="196" r="56" fill="#4063D8" fill-opacity="0.14" stroke="#4063D8" stroke-width="12"/>
  <line x1="257" y1="237" x2="292" y2="272" stroke="#4063D8" stroke-width="18" stroke-linecap="round"/>
</svg>
